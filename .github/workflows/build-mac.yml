# ARCO: builds the Mac app and the iPad / iPhone app (releases from main)
name: Build ARCO
# Builds only for a release (a push to main) or by hand - Mac / iPad minutes are precious on a private project.
on:
  push:
    branches: [main]
    paths-ignore: ["Score/**", ".github/workflows/build-score.yml"]
  workflow_dispatch:
concurrency:
  group: arco-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Get JUCE 8.0.4
        run: git clone --depth 1 --branch 8.0.4 https://github.com/juce-framework/JUCE.git JUCE
      - name: Configure
        run: cmake -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DARCO_BUILD=${{ github.run_number }}
      - name: Build
        run: |
          set -o pipefail
          cmake --build build --target ARCO -j 4 2>&1 | tee build.log || { grep -E "error:" build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      - name: Sign (ad-hoc) and pack
        run: |
          APP=$(find build -name "ARCO.app" -path "*Release*" | head -1)
          cat > ent.plist <<'PL'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>com.apple.security.device.audio-input</key><true/><key>com.apple.security.cs.disable-library-validation</key><true/><key>com.apple.security.cs.allow-unsigned-executable-memory</key><true/></dict></plist>
          PL
          codesign --force --deep --options runtime --entitlements ent.plist -s - "$APP"
          codesign --verify --deep --strict "$APP"
          lipo -info "$APP/Contents/MacOS/ARCO"
          mkdir -p dist && ditto -c -k --keepParent "$APP" dist/ARCO-mac.zip
      - name: Self-test (Mac)
        run: |
          APP=$(find build -name "ARCO.app" -path "*Release*" | head -1)
          "$APP/Contents/MacOS/ARCO" --selftest | tee dist/selftest-mac.txt || true
          grep "FAIL" dist/selftest-mac.txt | while IFS= read -r l; do echo "::error::$l"; done
          grep -q " 0 failed" dist/selftest-mac.txt
      - name: Screenshots
        run: |
          APP=$(find build -name "ARCO.app" -path "*Release*" | head -1)
          "$APP/Contents/MacOS/ARCO" --screenshot "$PWD/dist/screen-main.png" || true
          "$APP/Contents/MacOS/ARCO" --screenshot "$PWD/dist/screen-synth.png" synth || true
          for s in workstation drums phrase loops studio; do "$APP/Contents/MacOS/ARCO" --screenshot "$PWD/dist/screen-$s.png" screen=$s demo2 || true; done
      - uses: actions/upload-artifact@v4
        with:
          name: ARCO-mac
          path: dist/

  ipad:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Get JUCE 8.0.4
        run: git clone --depth 1 --branch 8.0.4 https://github.com/juce-framework/JUCE.git JUCE
      - name: Build for iPad / iPhone (unsigned - your Mac signs it with your Apple ID)
        run: |
          cd Builds/iOS
          set -o pipefail
          xcodebuild -project ARCO.xcodeproj -target "ARCO - App" -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CONFIGURATION_BUILD_DIR="$PWD/out/device" -quiet build 2>&1 | tee build.log || {
            grep -E "error:|Error |Undefined|referenced from|ld: " build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
          ls -la out/device/ARCO.app | head -5
      - name: Build for the iPad simulator
        run: |
          cd Builds/iOS
          xcodebuild -project ARCO.xcodeproj -target "ARCO - App" -configuration Release -sdk iphonesimulator ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR="$PWD/out/sim" -quiet build
          ls -la out/sim/ARCO.app | head -3
      - name: Self-test on an iPad (simulator)
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          ids=[x['udid'] for k,v in d.items() if 'iOS' in k for x in v if 'iPad' in x['name']]
          print(ids[-1] if ids else '')")
          echo "iPad simulator: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" Builds/iOS/out/sim/ARCO.app
          mkdir -p dist
          ( xcrun simctl launch --console-pty "$UDID" com.pacello.arco --selftest 2>&1 | tee dist/selftest-ipad.txt ) &
          for i in $(seq 1 120); do sleep 2; grep -q "checks," dist/selftest-ipad.txt 2>/dev/null && break; done
          sleep 2
          cat dist/selftest-ipad.txt | tail -5
          grep "FAIL" dist/selftest-ipad.txt | while IFS= read -r l; do echo "::error::iPad $l"; done
          grep -q " 0 failed" dist/selftest-ipad.txt
      - name: Pack ARCO.ipa (for Sideloadly - it signs it with your Apple ID)
        run: |
          mkdir -p ipa/Payload dist
          cp -R Builds/iOS/out/device/ARCO.app ipa/Payload/
          file ipa/Payload/ARCO.app/ARCO
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" ipa/Payload/ARCO.app/Info.plist
          cd ipa && zip -qry ../dist/ARCO.ipa Payload && cd ..
          unzip -l dist/ARCO.ipa | tail -1
      - name: Pack the Xcode project for your Mac
        run: |
          mkdir -p pkg/ARCO-iPad dist
          cp -R ARCO.jucer Source Resources Builds JuceLibraryCode VERSION pkg/ARCO-iPad/
          rm -rf pkg/ARCO-iPad/Builds/iOS/build pkg/ARCO-iPad/Builds/iOS/out
          mkdir -p pkg/ARCO-iPad/JUCE && cp -R JUCE/modules JUCE/LICENSE.md pkg/ARCO-iPad/JUCE/
          cp docs/iPad-install.txt "pkg/ARCO-iPad/HOW TO INSTALL ON THE iPAD.txt"
          cd pkg && ditto -c -k --keepParent ARCO-iPad ../dist/ARCO-iPad-Xcode.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ARCO-ipad
          path: dist/

  release:
    needs: [mac, ipad]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Publish the release (private, like the repository)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(cat VERSION)
          TAG="v$V-b${{ github.run_number }}"
          git log -1 --pretty=%B > notes.txt
          gh release create "$TAG" out/ARCO-mac/ARCO-mac.zip out/ARCO-ipad/ARCO.ipa out/ARCO-ipad/ARCO-iPad-Xcode.zip \
            --title "ARCO $V (build ${{ github.run_number }})" --notes-file notes.txt --latest
